name: Research regression tests
on:
  workflow_dispatch:
  pull_request:
    paths: ['scraper/**', '.github/workflows/**']
  push:
    paths: ['scraper/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r scraper/requirements.txt
      - run: python -m unittest discover -s scraper -p 'test_*.py'
      - name: Validate the complete published archive
        run: python scraper/validate_data.py
